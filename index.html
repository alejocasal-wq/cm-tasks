<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CM Tasks">
<title>CM Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500i&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bordo: #6B1A2E;
  --bordo-mid: #7D2035;
  --bordo-light: #9B3050;
  --rosa: #E8A0B4;
  --rosa-light: #F5D0DC;
  --rosa-deep: #C4607A;
  --negro: #0D090B;
  --negro2: #170F13;
  --negro3: #211519;
  --blanco: #FAF5F7;
  --gris: #7A6870;
  --gris-light: #A89AA2;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; background: var(--negro); color: var(--blanco);
  font-family: 'DM Sans', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;
}
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 430px; margin: 0 auto;
}

/* ── HEADER ── */
.header { padding: calc(var(--safe-t) + 16px) 20px 0; background: var(--negro); flex-shrink: 0; }
.header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.header-label { font-size: 10px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 2px; }
.header-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--rosa); line-height: 1.1; }
.add-brand-btn {
  background: var(--bordo); border: none; color: var(--rosa-light);
  width: 36px; height: 36px; border-radius: 50%; font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; margin-top: 4px;
  box-shadow: 0 4px 14px rgba(107,26,46,0.5);
}

/* ── BRAND TABS ── */
.tabs-wrap { overflow-x: auto; white-space: nowrap; padding: 0 20px 14px; scrollbar-width: none; flex-shrink: 0; }
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 22px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1.5px solid rgba(107,26,46,0.35);
  background: transparent; color: var(--gris-light); margin-right: 8px;
  vertical-align: top; transition: all 0.2s;
}
.tab.active { background: var(--bordo); border-color: var(--bordo); color: var(--rosa-light); }
.tab .cnt { background: rgba(232,160,180,0.22); color: var(--rosa); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
.tab.active .cnt { background: rgba(255,255,255,0.18); color: #fff; }



/* ── SCREENS ── */
.screen { display: none; flex-direction: column; overflow: hidden; flex: 1; }
.screen.active { display: flex; }
.content { flex: 1; overflow-y: auto; padding-bottom: 10px; }

/* ── BRAND COVER ── */
.brand-cover {
  position: relative; height: 160px; margin: 0 20px 18px;
  border-radius: 16px; overflow: hidden;
  background: var(--negro2); border: 1px solid rgba(107,26,46,0.3);
  cursor: pointer;
}
.brand-cover img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.cover-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(13,9,11,0.85) 0%, rgba(13,9,11,0.2) 60%, transparent 100%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 14px 16px;
}
.cover-name {
  font-family: 'Playfair Display', serif; font-size: 22px; color: var(--blanco);
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.cover-edit-hint {
  font-size: 11px; color: rgba(232,160,180,0.75); margin-top: 2px;
}
.cover-empty-inner {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 8px; color: var(--gris);
}
.cover-empty-ico { font-size: 28px; }
.cover-empty-txt { font-size: 12px; }
.cover-input { display: none; }

/* ── STATS ── */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; margin: 0 20px 18px;
  background: rgba(107,26,46,0.2); border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(107,26,46,0.25);
}
.stat { background: var(--negro2); padding: 12px 6px; text-align: center; }
.stat-n { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--rosa); display: block; line-height: 1; }
.stat-l { font-size: 10px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

/* ── SECTION ── */
.section { padding: 0 20px; margin-bottom: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--bordo-light); display: flex; align-items: center; gap: 7px;
}
.section-label::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--bordo-light); display: block; }
.add-btn {
  font-size: 12px; font-weight: 500; color: var(--gris-light);
  background: none; border: 1px solid rgba(107,26,46,0.3);
  padding: 4px 12px; border-radius: 20px; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}
.add-btn:active { background: var(--negro3); color: var(--rosa); }

/* ── TASK CARDS ── */
.task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.task {
  background: var(--negro2); border-radius: 13px;
  border: 1px solid rgba(107,26,46,0.22);
  display: flex; align-items: flex-start; gap: 11px;
  padding: 13px 13px 13px 14px; cursor: pointer;
  position: relative; overflow: hidden; transition: transform 0.15s;
}
.task:active { transform: scale(0.985); }
.task.done { background: var(--negro3); border-color: rgba(107,26,46,0.1); }
.task.done::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bordo); }
.chk {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid rgba(107,26,46,0.55); background: transparent;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px; transition: all 0.25s;
}
.task.done .chk { background: var(--bordo); border-color: var(--bordo); }
.chk-ico { opacity: 0; transition: opacity 0.2s; }
.task.done .chk-ico { opacity: 1; }
.task-body { flex: 1; min-width: 0; }
.task-txt { font-size: 14px; line-height: 1.45; color: var(--blanco); word-break: break-word; }
.task.done .task-txt { color: var(--gris); text-decoration: line-through; text-decoration-color: var(--bordo-mid); }
.task-foot { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
.task-date { font-size: 11px; color: var(--gris); }
.tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.tag-pend { background: rgba(107,26,46,0.28); color: var(--rosa); }
.tag-urg  { background: rgba(196,96,122,0.28); color: #F5AABB; }
.tag-done { background: rgba(107,26,46,0.12); color: var(--gris); }
.del-btn { background: none; border: none; color: var(--gris); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; opacity: 0.45; flex-shrink: 0; }
.del-btn:active { opacity: 1; color: var(--rosa-deep); }

/* ── IDEA CARDS ── */
.idea-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.idea-card {
  background: var(--negro2); border-radius: 13px;
  border: 1px solid rgba(107,26,46,0.22);
  padding: 13px 14px; position: relative;
  border-left: 3px solid var(--bordo);
}
.idea-txt { font-size: 14px; line-height: 1.5; color: var(--blanco); word-break: break-word; padding-right: 28px; }
.idea-date { font-size: 11px; color: var(--gris); margin-top: 5px; }
.idea-del {
  position: absolute; top: 10px; right: 10px;
  background: none; border: none; color: var(--gris); font-size: 18px;
  cursor: pointer; opacity: 0.4; line-height: 1;
}
.idea-del:active { opacity: 1; color: var(--rosa-deep); }

/* ── EMPTY / NO BRAND ── */
.empty { text-align: center; padding: 28px 16px; color: var(--gris); }
.empty-ico { font-size: 28px; margin-bottom: 7px; }
.empty-txt { font-size: 13px; line-height: 1.5; }
.no-brand { padding: 48px 28px; text-align: center; }
.no-brand-ico { font-size: 36px; margin-bottom: 12px; }
.no-brand-t { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--rosa); margin-bottom: 8px; }
.no-brand-s { font-size: 13px; color: var(--gris); line-height: 1.6; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex; background: var(--negro2);
  border-top: 1px solid rgba(107,26,46,0.28);
  padding: 10px 0 calc(var(--safe-b) + 10px); flex-shrink: 0;
}
.nb {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--gris); cursor: pointer;
  font-size: 10px; font-weight: 500; font-family: 'DM Sans', sans-serif; padding: 3px;
}
.nb.active { color: var(--rosa); }
.nb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ── HISTORY ── */
.hist-pad { padding: 18px 20px; }
.hist-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--rosa); margin-bottom: 14px; }
.hist-filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; padding-bottom: 2px; }
.hist-filters::-webkit-scrollbar { display: none; }
.hf {
  flex-shrink: 0; padding: 5px 13px; border-radius: 16px;
  font-size: 12px; border: 1px solid rgba(107,26,46,0.3);
  background: none; color: var(--gris-light); cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.hf.active { background: var(--bordo); color: var(--rosa-light); border-color: var(--bordo); }
.hist-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(107,26,46,0.13); }
.hist-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bordo); flex-shrink: 0; margin-top: 5px; }
.hist-info { flex: 1; }
.hist-txt { font-size: 13px; color: var(--gris-light); line-height: 1.4; }
.hist-meta { display: flex; gap: 8px; margin-top: 4px; }
.hist-brand { font-size: 11px; color: var(--rosa); font-weight: 600; }
.hist-date { font-size: 11px; color: var(--gris); }

/* ── MODALS ── */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(8,4,6,0.88); backdrop-filter: blur(5px);
  align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--negro2); border-radius: 22px 22px 0 0;
  padding: 22px 20px calc(var(--safe-b) + 22px);
  width: 100%; max-width: 430px;
  border-top: 1px solid rgba(107,26,46,0.4);
  animation: up 0.27s ease;
}
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--rosa); margin-bottom: 16px; }
.mlabel { font-size: 11px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; display: block; }
.mrow { margin-bottom: 12px; }
.minput, .mtarea {
  width: 100%; background: var(--negro3); border: 1.5px solid rgba(107,26,46,0.4);
  border-radius: 12px; color: var(--blanco); font-family: 'DM Sans', sans-serif;
  font-size: 14px; padding: 12px 14px; outline: none;
}
.minput:focus, .mtarea:focus { border-color: var(--bordo-light); }
.mtarea { resize: none; min-height: 80px; display: block; }
.tag-row { display: flex; gap: 9px; }
.topt {
  flex: 1; padding: 9px 8px; border-radius: 11px; text-align: center;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: 1.5px solid transparent; font-family: 'DM Sans', sans-serif;
}
.topt.tp { background: rgba(107,26,46,0.2); color: var(--rosa); border-color: rgba(107,26,46,0.35); }
.topt.tu { background: rgba(196,96,122,0.2); color: #F5AABB; border-color: rgba(196,96,122,0.35); }
.topt.sel { border-width: 2px; filter: brightness(1.35); }
.mbtns { display: flex; gap: 10px; margin-top: 14px; }
.bcnl {
  flex: 1; padding: 13px; border-radius: 13px;
  border: 1px solid rgba(107,26,46,0.35); background: none;
  color: var(--gris-light); font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.bsave {
  flex: 2; padding: 13px; border-radius: 13px; border: none;
  background: var(--bordo); color: var(--rosa-light);
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.bsave:active { filter: brightness(1.2); }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-label">Community Manager</div>
        <div class="header-title">Mis Marcas</div>
      </div>
      <button class="add-brand-btn" onclick="openBrandModal()">+</button>
    </div>
    <div class="tabs-wrap" id="tabs"></div>
  </div>

  <!-- MAIN SCREENS -->
  <div class="screen active" id="scr-tasks">
    <div class="content" id="taskContent"></div>
  </div>

  <div class="screen" id="scr-ideas">
    <div class="content" id="ideaContent"></div>
  </div>

  <div class="screen" id="scr-hist">
    <div class="content">
      <div class="hist-pad">
        <div class="hist-title">Historial</div>
        <div class="hist-filters" id="histFilters"></div>
        <div id="histList"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nb active" id="nb-tasks" onclick="switchScreen('tasks')">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
      Marcas
    </button>
    <button class="nb" id="nb-ideas" onclick="switchScreen('ideas')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      Ideas
    </button>
    <button class="nb" id="nb-hist" onclick="switchScreen('hist')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Historial
    </button>
  </div>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="taskModal">
  <div class="modal">
    <div class="modal-title">Nueva tarea</div>
    <div class="mrow">
      <label class="mlabel">¿Qué tenés que hacer?</label>
      <textarea class="mtarea" id="taskTxt" placeholder="Ej: Armar reel para IG, programar stories, editar fotos..."></textarea>
    </div>
    <div class="mrow">
      <label class="mlabel">Prioridad</label>
      <div class="tag-row">
        <div class="topt tp sel" id="topt-p" onclick="pickTag('p')">Pendiente</div>
        <div class="topt tu" id="topt-u" onclick="pickTag('u')">Urgente</div>
      </div>
    </div>
    <div class="mbtns">
      <button class="bcnl" onclick="closeModal('taskModal')">Cancelar</button>
      <button class="bsave" onclick="saveTask()">Guardar tarea</button>
    </div>
  </div>
</div>

<!-- IDEA MODAL -->
<div class="overlay" id="ideaModal">
  <div class="modal">
    <div class="modal-title">Nueva idea ✦</div>
    <div class="mrow">
      <label class="mlabel">¿Qué se te ocurrió?</label>
      <textarea class="mtarea" id="ideaTxt" placeholder="Ej: Hacer una serie de reels con tips de skincare, sorteo colaborativo con otra marca..."></textarea>
    </div>
    <div class="mbtns">
      <button class="bcnl" onclick="closeModal('ideaModal')">Cancelar</button>
      <button class="bsave" onclick="saveIdea()">Guardar idea</button>
    </div>
  </div>
</div>

<!-- BRAND MODAL -->
<div class="overlay" id="brandModal">
  <div class="modal">
    <div class="modal-title">Nueva marca</div>
    <div class="mrow">
      <label class="mlabel">Nombre de la marca</label>
      <input class="minput" id="brandName" type="text" placeholder="Ej: OG Estética, Lumina, Reverie...">
    </div>
    <div class="mbtns">
      <button class="bcnl" onclick="closeModal('brandModal')">Cancelar</button>
      <button class="bsave" onclick="saveBrand()">Agregar marca</button>
    </div>
  </div>
</div>

<!-- hidden file input for cover photo -->
<input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCoverPhoto(event)">

<script>
// ── STORAGE ──
const K_BRANDS = 'cmtasks_brands';
const K_TASKS  = 'cmtasks_tasks';
const K_IDEAS  = 'cmtasks_ideas';
const K_COVERS = 'cmtasks_covers';

const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));
// covers stored separately as they can be large base64 strings
const loadCover  = b => { try { return localStorage.getItem('cover_' + b) || null; } catch { return null; } };
const saveCover  = (b,v) => { try { localStorage.setItem('cover_' + b, v); } catch(e) { alert('La foto es demasiado grande. Probá con una imagen más chica.'); } };
const delCover   = b => localStorage.removeItem('cover_' + b);

// ── STATE ──
let brands    = load(K_BRANDS) || [];
let tasks     = load(K_TASKS)  || [];
let ideas     = load(K_IDEAS)  || [];
let curBrand  = brands[0] || null;
let curScreen = 'tasks';
let curTag    = 'p';
let histBrand = 'all';

const uid = () => Math.random().toString(36).slice(2) + Date.now();
const fmt = ts => new Date(ts).toLocaleDateString('es-AR', { day:'2-digit', month:'short' });
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// ── TABS ──
function renderTabs() {
  const el = document.getElementById('tabs');
  if (!brands.length) { el.innerHTML = ''; return; }
  el.innerHTML = brands.map(b => {
    const p = tasks.filter(t => t.brand === b && !t.done).length;
    return `<div class="tab${b===curBrand?' active':''}" onclick="setBrand('${esc(b)}')">${esc(b)}${p?` <span class="cnt">${p}</span>`:''}</div>`;
  }).join('');
}
function setBrand(b) {
  curBrand = b;
  renderTabs();
  if (curScreen === 'tasks') renderTasks();
  else if (curScreen === 'ideas') renderIdeas();
}

// ── COVER ──
function openCoverPicker() {
  document.getElementById('coverInput').click();
}
function handleCoverPhoto(e) {
  const file = e.target.files[0];
  if (!file || !curBrand) return;
  const reader = new FileReader();
  reader.onload = ev => {
    saveCover(curBrand, ev.target.result);
    if (curSub === 'tasks') renderTasks();
    else renderIdeas();
  };
  reader.readAsDataURL(file);
  e.target.value = ''; // reset so same file can be picked again
}
function coverHTML(brand) {
  const img = loadCover(brand);
  if (img) {
    return `<div class="brand-cover" onclick="openCoverPicker()">
      <img src="${img}" alt="${esc(brand)}">
      <div class="cover-overlay">
        <div class="cover-name">${esc(brand)}</div>
        <div class="cover-edit-hint">Tocá para cambiar la foto</div>
      </div>
    </div>`;
  }
  return `<div class="brand-cover" onclick="openCoverPicker()">
    <div class="cover-empty-inner">
      <div class="cover-empty-ico">📷</div>
      <div class="cover-empty-txt">Tocá para agregar una foto de portada</div>
    </div>
  </div>`;
}

// ── TASKS SCREEN ──
function renderTasks() {
  const el = document.getElementById('taskContent');
  if (!brands.length) {
    el.innerHTML = `<div class="no-brand"><div class="no-brand-ico">✦</div><div class="no-brand-t">Agregá tu primera marca</div><div class="no-brand-s">Tocá el <strong>+</strong> de arriba para crear<br>una marca y cargar tus tareas.</div></div>`;
    return;
  }
  const mine = tasks.filter(t => t.brand === curBrand);
  const pend = mine.filter(t => !t.done);
  const done = mine.filter(t => t.done);
  const pct  = mine.length ? Math.round(done.length / mine.length * 100) : 0;

  let h = coverHTML(curBrand);

  h += `<div class="stats">
    <div class="stat"><span class="stat-n">${pend.length}</span><span class="stat-l">Pendientes</span></div>
    <div class="stat"><span class="stat-n">${done.length}</span><span class="stat-l">Hechas</span></div>
    <div class="stat"><span class="stat-n">${pct}%</span><span class="stat-l">Progreso</span></div>
  </div>`;

  h += `<div class="section"><div class="section-head">
    <div class="section-label">Por hacer</div>
    <button class="add-btn" onclick="openTaskModal()">+ Agregar</button>
  </div><div class="task-list">`;
  if (!pend.length) h += `<div class="empty"><div class="empty-ico">🌸</div><div class="empty-txt">Sin tareas pendientes.<br>¡Todo al día!</div></div>`;
  else pend.forEach(t => { h += taskHTML(t); });
  h += `</div></div>`;

  if (done.length) {
    h += `<div class="section"><div class="section-head"><div class="section-label">Completadas</div></div><div class="task-list">`;
    done.forEach(t => { h += taskHTML(t); });
    h += `</div></div>`;
  }
  el.innerHTML = h;
}

function taskHTML(t) {
  const cls = t.done ? 'tag-done' : (t.tag === 'u' ? 'tag-urg' : 'tag-pend');
  const lbl = t.done ? 'Hecho' : (t.tag === 'u' ? 'Urgente' : 'Pendiente');
  return `<div class="task${t.done?' done':''}" onclick="toggle('${t.id}')">
    <div class="chk"><svg class="chk-ico" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="task-body">
      <div class="task-txt">${esc(t.text)}</div>
      <div class="task-foot"><span class="task-date">${fmt(t.created)}</span><span class="tag ${cls}">${lbl}</span></div>
    </div>
    <button class="del-btn" onclick="delTask(event,'${t.id}')">×</button>
  </div>`;
}

function toggle(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  save(K_TASKS, tasks); renderTabs(); renderTasks();
}
function delTask(e, id) {
  e.stopPropagation();
  tasks = tasks.filter(x => x.id !== id);
  save(K_TASKS, tasks); renderTabs(); renderTasks();
}

// ── IDEAS SCREEN ──
function renderIdeas() {
  const el = document.getElementById('ideaContent');
  if (!brands.length) {
    el.innerHTML = `<div class="no-brand"><div class="no-brand-ico">✦</div><div class="no-brand-t">Agregá tu primera marca</div><div class="no-brand-s">Tocá el <strong>+</strong> de arriba para empezar.</div></div>`;
    return;
  }
  const mine = ideas.filter(i => i.brand === curBrand)
    .sort((a,b) => b.created - a.created);

  let h = coverHTML(curBrand);

  h += `<div class="section"><div class="section-head">
    <div class="section-label">Ideas</div>
    <button class="add-btn" onclick="openIdeaModal()">+ Nueva idea</button>
  </div><div class="idea-list">`;

  if (!mine.length) {
    h += `<div class="empty"><div class="empty-ico">💡</div><div class="empty-txt">Todavía no hay ideas para esta marca.<br>¡Guardá la próxima que se te ocurra!</div></div>`;
  } else {
    mine.forEach(i => {
      h += `<div class="idea-card">
        <div class="idea-txt">${esc(i.text)}</div>
        <div class="idea-date">${fmt(i.created)}</div>
        <button class="idea-del" onclick="delIdea('${i.id}')">×</button>
      </div>`;
    });
  }
  h += `</div></div>`;
  el.innerHTML = h;
}

function delIdea(id) {
  ideas = ideas.filter(x => x.id !== id);
  save(K_IDEAS, ideas); renderIdeas();
}

// ── TASK MODAL ──
function openTaskModal() {
  document.getElementById('taskTxt').value = '';
  pickTag('p'); openModal('taskModal');
  setTimeout(() => document.getElementById('taskTxt').focus(), 320);
}
function pickTag(t) {
  curTag = t;
  document.querySelectorAll('.topt').forEach(el => el.classList.remove('sel'));
  document.getElementById('topt-' + t).classList.add('sel');
}
function saveTask() {
  const txt = document.getElementById('taskTxt').value.trim();
  if (!txt || !curBrand) return;
  tasks.unshift({ id: uid(), brand: curBrand, text: txt, tag: curTag, done: false, created: Date.now(), doneAt: null });
  save(K_TASKS, tasks); closeModal('taskModal'); renderTabs(); renderTasks();
}

// ── IDEA MODAL ──
function openIdeaModal() {
  document.getElementById('ideaTxt').value = '';
  openModal('ideaModal');
  setTimeout(() => document.getElementById('ideaTxt').focus(), 320);
}
function saveIdea() {
  const txt = document.getElementById('ideaTxt').value.trim();
  if (!txt || !curBrand) return;
  ideas.unshift({ id: uid(), brand: curBrand, text: txt, created: Date.now() });
  save(K_IDEAS, ideas); closeModal('ideaModal'); renderIdeas();
}

// ── BRAND MODAL ──
function openBrandModal() {
  document.getElementById('brandName').value = '';
  openModal('brandModal');
  setTimeout(() => document.getElementById('brandName').focus(), 320);
}
function saveBrand() {
  const name = document.getElementById('brandName').value.trim();
  if (!name || brands.includes(name)) return;
  brands.push(name); save(K_BRANDS, brands);
  curBrand = name; closeModal('brandModal'); renderTabs(); switchScreen('tasks');
}

// ── MODALS ──
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
});

// ── HISTORY ──
function renderHistory() {
  document.getElementById('histFilters').innerHTML = ['all', ...brands].map(b =>
    `<button class="hf${histBrand===b?' active':''}" onclick="setHistBrand('${esc(b)}')">${b==='all'?'Todas':esc(b)}</button>`
  ).join('');
  const done = tasks
    .filter(t => t.done && (histBrand === 'all' || t.brand === histBrand))
    .sort((a,b) => (b.doneAt||b.created) - (a.doneAt||a.created));
  const el = document.getElementById('histList');
  if (!done.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">✦</div><div class="empty-txt">Todavía no hay tareas completadas.</div></div>`;
    return;
  }
  el.innerHTML = done.map(t => `<div class="hist-item">
    <div class="hist-dot"></div>
    <div class="hist-info">
      <div class="hist-txt">${esc(t.text)}</div>
      <div class="hist-meta"><span class="hist-brand">${esc(t.brand)}</span><span class="hist-date">${fmt(t.doneAt||t.created)}</span></div>
    </div>
  </div>`).join('');
}
function setHistBrand(b) { histBrand = b; renderHistory(); }

// ── SCREEN SWITCH ──
function switchScreen(s) {
  curScreen = s;
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(el => el.classList.remove('active'));
  document.getElementById('scr-' + s).classList.add('active');
  document.getElementById('nb-' + s).classList.add('active');
  if (s === 'tasks') renderTasks();
  else if (s === 'ideas') renderIdeas();
  else if (s === 'hist') renderHistory();
}

// ── INIT ──
renderTabs(); renderTasks();
document.getElementById('brandName').addEventListener('keydown', e => { if (e.key==='Enter') saveBrand(); });
</script>
</body>
</html>
